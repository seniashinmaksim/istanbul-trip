<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Стамбул">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Поездка</title>
<style>
:root{--paper:#F4F6FA;--card:#fff;--ink:#16203A;--muted:#5A6684;--line:#DCE2EE;--accent:#1F4AA8;--bad:#C53A2C}
@media (prefers-color-scheme: dark){:root{--paper:#0C1222;--card:#151D33;--ink:#E8ECF6;--muted:#9AA6C3;--line:#26304C;--accent:#6E97F0;--bad:#F07462;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.logo{width:56px;height:56px;border-radius:14px}
h1{margin:0;font-size:22px;font-family:Georgia,serif;font-weight:400}
p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--bad);font-size:13.5px;min-height:18px}
label.rm{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
label.rm input{width:18px;height:18px;padding:0}
</style>
</head>
<body>
<form id="f" autocomplete="on" hidden>
  <img class="logo" src="icon-180.png" alt="">
  <h1>Наша поездка</h1>
  <p>Введите пароль. Телефон запомнит его, и в следующий раз страница откроется сразу.</p>
  <input type="text" name="username" value="trip" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required>
  <label class="rm"><input id="rm" type="checkbox" checked> Запомнить на этом телефоне</label>
  <button id="go" type="submit">Открыть</button>
  <div class="err" id="err" role="alert"></div>
</form>

function b64e(u){var s="";u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function ready(){return new Promise(function(r){if(document.readyState==="complete")setTimeout(r,0);else window.addEventListener("load",function(){setTimeout(r,0);});});}
